services:
  backend:
    build:
      context: /home/runner/work/scholarflow-ai-enterprise/scholarflow-ai-enterprise/backend
    container_name: scholarflow-backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SERVICE_NAME: core
      SERVICE_METADATA_TAGS: core,auth,plagiarism,citation,collaboration,billing,admin
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/core/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: /home/runner/work/scholarflow-ai-enterprise/scholarflow-ai-enterprise/frontend
    container_name: scholarflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: scholarflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scholarflow
      MYSQL_USER: scholarflow
      MYSQL_PASSWORD: scholarflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scholarflow-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: scholarflow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: scholarflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.20
    container_name: scholarflow-consul
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"

  vault:
    image: hashicorp/vault:1.18
    container_name: scholarflow-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "server -dev"
    ports:
      - "8200:8200"

  ollama:
    image: ollama/ollama:0.11.11
    container_name: scholarflow-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  kong:
    image: kong:3.7
    container_name: scholarflow-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - /home/runner/work/scholarflow-ai-enterprise/scholarflow-ai-enterprise/deploy/kong/kong.yml:/opt/kong/kong.yml:ro
    ports:
      - "8001:8001"
      - "8000:8000"
    depends_on:
      - backend
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: scholarflow-nginx
    volumes:
      - /home/runner/work/scholarflow-ai-enterprise/scholarflow-ai-enterprise/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - kong

volumes:
  mysql_data:
  es_data:
  ollama_data:
