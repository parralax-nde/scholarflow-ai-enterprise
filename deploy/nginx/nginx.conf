worker_processes  1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  resolver      127.0.0.11 ipv6=off valid=10s;

  upstream kong_upstream {
    server kong:8000;
  }

  upstream frontend_upstream {
    server frontend:80;
  }

  upstream docx_viewer_upstream {
    server docx-viewer:3000;
  }

  server {
    listen 80;

    location = /api/ai/chat/stream {
      set $kong_origin http://kong:8000;
      proxy_pass $kong_origin;
      proxy_http_version 1.1;
      proxy_connect_timeout 30s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_buffering off;
      proxy_cache off;
      proxy_request_buffering off;
      chunked_transfer_encoding on;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /api {
      set $kong_origin http://kong:8000;
      proxy_pass $kong_origin;
      proxy_connect_timeout 30s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location / {
      set $frontend_origin http://frontend:80;
      proxy_pass $frontend_origin;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }

    location /docx-viewer/ {
      set $viewer_origin http://docx-viewer:3000;
      proxy_pass $viewer_origin/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
    }
  }
}
