services:
  backend:
    build:
      context: ./backend
    container_name: scholarflow-backend
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      SERVICE_NAME: core
      SERVICE_METADATA_TAGS: core,auth,plagiarism,citation,collaboration,billing,admin
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:e2b
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      SUPERDOC_MCP_URL: http://superdoc-mcp:8090/mcp
      DOCX_ARTIFACT_DIR: /shared/docx
    volumes:
      - docx_shared:/shared/docx
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/core/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_healthy
      superdoc-mcp:
        condition: service_healthy

  superdoc-mcp:
    image: node:20-alpine
    container_name: scholarflow-superdoc-mcp
    command:
      - sh
      - -lc
      - >-
        npx -y supergateway
        --stdio "npx -y @superdoc-dev/mcp"
        --outputTransport streamableHttp
        --streamableHttpPath /mcp
        --stateful
        --port 8090
        --healthEndpoint /healthz
        --logLevel info
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/healthz"]
      interval: 20s
      timeout: 5s
      retries: 8
    volumes:
      - docx_shared:/shared/docx

  frontend:
    build:
      context: ./frontend
    container_name: scholarflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  docx-viewer:
    build:
      context: ./docx-viewer
    container_name: scholarflow-docx-viewer
    environment:
      API_BASE_URL: http://backend:8000
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: scholarflow-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: scholarflow
      MYSQL_USER: scholarflow
      MYSQL_PASSWORD: scholarflow
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 15s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scholarflow-redis
    ports:
      - "6379:6379"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: scholarflow-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: scholarflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 15s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.20
    container_name: scholarflow-consul
    command: "agent -dev -client=0.0.0.0"
    ports:
      - "8500:8500"

  vault:
    image: hashicorp/vault:1.18
    container_name: scholarflow-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    command: "server -dev"
    ports:
      - "8200:8200"

  ollama:
    image: ollama/ollama:latest
    container_name: scholarflow-ollama
    environment:
      OLLAMA_HOST: http://0.0.0.0:11434
      OLLAMA_MODEL: gemma4:e2b
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
      OLLAMA_KEEP_WARM_INTERVAL: ${OLLAMA_KEEP_WARM_INTERVAL:-90}
    entrypoint: ["/bin/sh", "/opt/ollama-start.sh"]
    healthcheck:
      test: ["CMD", "sh", "-lc", "test -f /tmp/ollama-ready"]
      interval: 10s
      timeout: 3s
      retries: 30
    ports:
      - "11434:11434"
    volumes:
      - ./deploy/ollama/start.sh:/opt/ollama-start.sh:ro
      - ollama_data:/root/.ollama

  kong:
    image: kong:3.7
    container_name: scholarflow-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /opt/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./deploy/kong/kong.yml:/opt/kong/kong.yml:ro
    ports:
      - "8001:8001"
      - "8000:8000"
    depends_on:
      - backend
      - frontend

  nginx:
    image: nginx:1.27-alpine
    container_name: scholarflow-nginx
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - kong
      - docx-viewer

volumes:
  mysql_data:
  es_data:
  ollama_data:
  docx_shared:
